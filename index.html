            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: repeating-linear-gradient(

        // 开启摄像头
        startBtn.addEventListener('click', async function() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;
                startBtn.style.display = 'none';
                captureBtn.style.display = 'inline-block';
            } catch (err) {
                alert('无法访问摄像头，请确保已授权摄像头权限！');
                console.error(err);
            }
        });

        // 捕获并分析
        captureBtn.addEventListener('click', function() {
            // 设置canvas尺寸
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // 捕获视频帧
            ctx.drawImage(video, 0, 0);
            
            // 保存捕获的图像数据
            capturedImageData = canvas.toDataURL('image/png');
            
            // 显示加载动画
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            
            // 模拟AI分析
            setTimeout(() => {
                analyzeFeatures();
            }, 2000);
        });

        // 分析特征
        function analyzeFeatures() {
            // 随机选择一个动物
            const randomAnimal = animals[Math.floor(Math.random() * animals.length)];
            const similarity = Math.floor(Math.random() * 20) + 80; // 80-99%的相似度
            
            displayResult(randomAnimal, similarity);
        }

        // 显示结果
        function displayResult(animal, similarity) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            
            // 显示动物名称 - 提取动物名称（去掉emoji）
            const animalNameOnly = animal.name.split(' ')[1];
            document.getElementById('animalName').textContent = `你是个${animalNameOnly}哟～`;
            
            // 显示用户的脸
            const userFaceCanvas = document.getElementById('userFace');
            const userFaceCtx = userFaceCanvas.getContext('2d');
            userFaceCanvas.width = 200;
            userFaceCanvas.height = 200;
            
            const img = new Image();
            img.onload = function() {
                // 计算裁剪比例，使图片居中显示
                const scale = Math.max(200 / img.width, 200 / img.height);
                const x = (200 / 2) - (img.width / 2) * scale;
                const y = (200 / 2) - (img.height / 2) * scale;
                userFaceCtx.drawImage(img, x, y, img.width * scale, img.height * scale);
            };
            img.src = capturedImageData;
            
            // 显示动物照片
            document.getElementById('animalPhoto').src = animal.image;
            document.getElementById('animalLabel').textContent = animal.emoji + ' ' + animal.name.split(' ')[1];
            
            // 显示相似度和描述
            document.getElementById('similarity').textContent = `🎯 相似度：${similarity}%`;
            document.getElementById('animalDescription').textContent = animal.description;
        }

        // 重新测试
        retryBtn.addEventListener('click', function() {
            document.getElementById('result').style.display = 'none';
            captureBtn.style.display = 'inline-block';
        });
    </script>
